<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title th:text="${title}">방탈출</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="container">
        <a class="logo" th:href="@{/home}">방탈출</a>
        <span class="branch-badge" th:if="${branchName}" th:text="'점포: ' + ${branchName}"></span>
        <nav>
            <a th:href="@{/home}">홈</a>
            <a th:href="@{/reservation-mine}">내 예약</a>
            <a th:if="${isStaff}" th:href="@{/admin}">관리자</a>
            <a id="logout-link" th:href="@{/}">로그아웃</a>
        </nav>
    </div>
    <script th:src="@{/js/logout.js}"></script>
</header>

<th:block th:fragment="toast">
    <div class="toast-container" id="toast-container"></div>
    <script th:src="@{/js/toast.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/util.js}"></script>
</th:block>
</body>
</html>
